<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crossfeed — Every chat, one feed</title>
    <meta
      name="description"
      content="Twitch, X, and Kick live chat merged into one labeled real-time feed that drops straight into OBS as a browser source."
    />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="landing.css" />
  </head>
  <body>
    <!-- ── Sticky nav ── -->
    <header class="nav" id="top">
      <div class="container nav-inner">
        <a class="wordmark" href="#top" aria-label="Crossfeed home">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          Crossfeed
        </a>
        <nav class="nav-links" aria-label="Primary">
          <a href="#how">How it works</a>
          <a href="#features">Features</a>
          <a class="btn btn-primary nav-cta" href="/signup">Get started</a>
        </nav>
      </div>
    </header>

    <main>
      <!-- ── Hero ── -->
      <section class="hero">
        <div class="container hero-grid">
          <div class="hero-copy">
            <span class="eyebrow" data-copy="eyebrow"></span>
            <h1 class="hero-title" data-copy="headline"></h1>
            <p class="hero-sub" data-copy="subhead"></p>
            <div class="hero-cta">
              <a class="btn btn-primary btn-lg" href="/signup" data-copy="ctaPrimary"></a>
              <a class="btn btn-ghost btn-lg" href="#how" data-copy="ctaSecondary"></a>
            </div>
            <ul class="hero-trust" data-copy-list="trust"></ul>
          </div>

          <!-- SIGNATURE: live, looping mock merged feed -->
          <div class="hero-feed">
            <div class="overlay-frame" aria-hidden="true">
              <div class="overlay-frame-bar">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                <span class="overlay-frame-label">OBS · Browser Source · transparent</span>
                <span class="live-tag">LIVE</span>
              </div>
              <div class="feed" id="heroFeed"></div>
            </div>
            <p class="hero-feed-note" data-copy="feedNote"></p>
          </div>
        </div>
      </section>

      <!-- ── Features ── -->
      <section class="section" id="features">
        <div class="container">
          <span class="eyebrow">Why Crossfeed</span>
          <h2 class="section-title" data-copy="featuresTitle"></h2>
          <div class="feature-grid" id="featureGrid"></div>
        </div>
      </section>

      <!-- ── How it works ── -->
      <section class="section section-alt" id="how">
        <div class="container">
          <span class="eyebrow">10-second setup</span>
          <h2 class="section-title" data-copy="howTitle"></h2>
          <ol class="steps" id="steps"></ol>
        </div>
      </section>

      <!-- ── What it looks like in OBS ── -->
      <section class="section" id="obs">
        <div class="container">
          <span class="eyebrow">In your scene</span>
          <h2 class="section-title" data-copy="obsTitle"></h2>
          <p class="section-lead" data-copy="obsLead"></p>
          <div class="stream-frame">
            <div class="stream-scene" aria-hidden="true">
              <div class="stream-cam"><span>YOUR STREAM</span></div>
              <div class="stream-grid"></div>
            </div>
            <div class="overlay-frame floating" aria-hidden="true">
              <div class="feed" id="obsFeed"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- ── FAQ ── -->
      <section class="section section-alt" id="faq">
        <div class="container narrow">
          <span class="eyebrow">Good questions</span>
          <h2 class="section-title" data-copy="faqTitle"></h2>
          <div class="faq" id="faq"></div>
        </div>
      </section>

      <!-- ── Final CTA ── -->
      <section class="section cta-band">
        <div class="container cta-inner">
          <h2 class="section-title" data-copy="finalCtaTitle"></h2>
          <a class="btn btn-primary btn-lg" href="/signup" data-copy="ctaPrimary"></a>
        </div>
      </section>
    </main>

    <!-- ── Footer ── -->
    <footer class="footer">
      <div class="container footer-inner">
        <a class="wordmark" href="#top">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          Crossfeed
        </a>
        <nav class="footer-links" aria-label="Footer">
          <a href="#features">Features</a>
          <a href="#how">How it works</a>
          <a href="#faq">FAQ</a>
          <a href="/login">Log in</a>
        </nav>
        <p class="footer-note" data-copy="footerNote"></p>
      </div>
    </footer>

    <script src="landing.js"></script>
  </body>
</html>
