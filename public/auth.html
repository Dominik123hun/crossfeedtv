<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crossfeed — Sign in</title>
    <link rel="icon" href="/assets/glyph.webp" type="image/webp" />
    <link rel="apple-touch-icon" href="/assets/glyph.webp" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0a0a0c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="theme.css" />
    <link rel="stylesheet" href="app.css" />
  </head>
  <body>
    <a class="auth-back" href="/">← Back</a>
    <main class="auth-wrap">
      <div class="card auth-card">
        <a class="wordmark" href="/">
          <span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
          Crossfeed
        </a>
        <div class="auth-head">
          <h1 id="authTitle">Create your account</h1>
          <p id="authSubtitle">Connect your channels and get your overlay URL in seconds.</p>
        </div>

        <div class="notice ok hidden" id="info" role="status"></div>
        <div class="notice error hidden" id="error" role="alert"></div>

        <form class="auth-form" id="authForm" novalidate>
          <div class="field" id="emailField">
            <label for="email">Email</label>
            <input class="input" type="email" id="email" name="email" autocomplete="email" required placeholder="you@example.com" />
          </div>
          <div class="field" id="passwordField">
            <div class="field-head">
              <label for="password">Password</label>
              <a href="/forgot" data-mode="forgot" id="forgotLink" class="field-link hidden">Forgot password?</a>
            </div>
            <input class="input" type="password" id="password" name="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters" />
          </div>
          <button class="btn btn-primary btn-lg btn-block" type="submit" id="submitBtn">Create account</button>
          <button class="btn btn-block hidden" type="button" id="secondaryBtn"></button>
        </form>

        <p class="auth-foot" id="switcher"></p>
      </div>
    </main>
    <script src="auth.js"></script>
  </body>
</html>
